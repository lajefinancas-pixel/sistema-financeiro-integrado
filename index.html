<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema Financeiro Integrado</title>

    <!--
      Ícone do sistema: o mesmo brasão dourado da Secretaria usado nas telas.
      O .ico atende navegadores antigos, o .svg escala sem perder nitidez e os
      PNGs do manifest cobrem "adicionar à tela inicial" no celular e o atalho
      fixado no desktop.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0F2A44" />
    <meta name="apple-mobile-web-app-title" content="Finanças" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.onerror = function (msg, url, line, col, error) {
        document.body.insertAdjacentHTML(
          "beforeend",
          '<pre style="position:fixed;top:0;left:0;right:0;background:#fff;color:red;padding:20px;z-index:99999;white-space:pre-wrap;font-size:14px;">ERRO: ' +
            msg +
            " (linha " +
            line +
            ")\n" +
            (error && error.stack ? error.stack : "") +
            "</pre>"
        );
      };
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
